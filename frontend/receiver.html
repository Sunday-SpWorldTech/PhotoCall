<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhotoCall — Join Call</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><span class="logo">◉</span><strong>PhotoCall</strong><small>Join Call</small></div><div id="status" class="status offline">Connecting…</div></header><main class="single"><section class="card"><span class="eyebrow">JOIN</span><h1>Connect to your partner</h1><p>No account is required. Enter the same room code used by the caller.</p><div class="call-row"><input id="room" maxlength="80" value="demo-room" placeholder="Room code"><button id="join" class="primary">Join room</button><button id="shareSignal" class="secondary">Share in Signal</button><button id="leave" class="danger" disabled>Leave</button></div><p id="state" class="message">Not connected.</p><video id="remote" autoplay playsinline></video></section></main><script type="module" src="/receiver.js"></script></body></html>
